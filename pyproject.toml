[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyder-bot"
version = "0.1.0"
description = "Telegram daily standup bot for engineering teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.7,<4.0",
  "aiohttp>=3.10,<4.0",
  "APScheduler>=3.10,<4.0",
  "asyncpg>=0.29,<0.31",
  "pydantic-settings>=2.4,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "greenlet>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<0.21",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
]

[project.scripts]
dailyder-bot = "dailyder_bot.__main__:main"
dailyder-migrate = "dailyder_bot.db.migrate:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dailyder_bot*"]

